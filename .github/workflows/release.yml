# 投屏助手 CI 发布工作流
# 推送 v* 标签时触发：构建安装包 + 发布 GitHub Release（附件含安装包与 DLL）
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm install

      # 安装 cargo 版 tauri-cli（自带 NSIS 插件，避免 npm 版插件缺失问题）
      - name: Install cargo tauri-cli
        run: cargo install tauri-cli

      # 下载 libmpv 动态库（libmpv-2.dll + libmpv-wrapper.dll）到 src-tauri/lib
      - name: Download libmpv DLLs
        run: npx tauri-plugin-libmpv-api setup-lib

      # 用 cargo 版 tauri build（自带 NSIS 插件，避免 npm 版插件缺失）
      - name: Build installer (cargo)
        shell: bash
        run: cargo tauri build

      # 获取版本号（从 package.json 读取）
      - name: Get version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = "${{ github.ref_name }}"
          echo "version=$tag" >> $env:GITHUB_OUTPUT
          $exeName = "投屏助手_$($tag)_x64-setup.exe"
          echo "exeName=$exeName" >> $env:GITHUB_OUTPUT
          Write-Output "version=$tag exeName=$exeName"

      # 创建 GitHub Release 并上传所有附件
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## 投屏助手 ${{ github.ref_name }}

            Windows 桌面投屏接收端（DLNA），MPV 内核。
            - **安装包**：`投屏助手_${{ github.ref_name }}_x64-setup.exe`
            - **附件**：libmpv-2.dll 与 libmpv-wrapper.dll
          files: |
            src-tauri/target/release/bundle/nsis/${{ steps.version.outputs.exeName }}
            src-tauri/lib/libmpv-2.dll
            src-tauri/lib/libmpv-wrapper.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
